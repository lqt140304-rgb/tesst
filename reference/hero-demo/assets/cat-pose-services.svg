<svg class="cat-mascot-svg" viewBox="0 0 1000 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catGradServices" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23706E" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#5A1E5E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FC9238" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softShadowSvc" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#23706E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <ellipse cx="500" cy="256" rx="420" ry="10" fill="rgba(35, 112, 110, 0.05)" />

  <!-- Dáng mèo: Ngồi dậy tò mò, giơ chân chỉ khám phá các dịch vụ y tế -->
  <g class="cat-body-group" filter="url(#softShadowSvc)">
    <!-- Thân mèo ngồi nghiêng tò mò -->
    <path d="
      M 320 250
      C 270 248, 230 220, 220 180
      C 210 140, 230 110, 260 95
      L 265 65
      C 275 60, 290 70, 300 85
      C 315 80, 335 80, 350 86
      L 365 60
      C 375 66, 380 80, 375 96
      C 395 115, 400 140, 395 170
      C 420 155, 480 130, 540 105
      C 555 98, 570 105, 572 120
      C 572 135, 550 150, 510 170
      C 460 195, 410 215, 395 245
      C 450 248, 580 248, 700 249
      C 740 230, 770 190, 780 150
      C 785 130, 805 130, 810 145
      C 805 180, 775 225, 730 250
      C 600 252, 420 252, 320 250 Z
    " fill="url(#catGradServices)" stroke="#23706E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Đệm chân chỉ hướng dịch vụ -->
    <g class="cat-paw-pads" transform="translate(545, 102)">
      <ellipse cx="12" cy="14" rx="7" ry="6" fill="#49A6AA" opacity="0.9"/>
      <circle cx="20" cy="5" r="3" fill="#49A6AA" opacity="0.9"/>
      <circle cx="12" cy="2" r="3" fill="#49A6AA" opacity="0.9"/>
      <circle cx="4" cy="5" r="2.8" fill="#49A6AA" opacity="0.9"/>
    </g>

    <!-- Khuôn mặt tò mò mắt mở to sáng ngời -->
    <g class="cat-face-details" stroke="#23706E" stroke-width="1.8" stroke-linecap="round" fill="none">
      <ellipse cx="295" cy="120" rx="5" ry="7" fill="#23706E" stroke="none"/>
      <circle cx="297" cy="117" r="2" fill="#fff" stroke="none"/>
      <ellipse cx="345" cy="120" rx="5" ry="7" fill="#23706E" stroke="none"/>
      <circle cx="347" cy="117" r="2" fill="#fff" stroke="none"/>
      <path d="M 320 132 L 324 137 L 316 137 Z" fill="#FC9238" stroke="none"/>
      <path d="M 320 138 Q 314 144 308 142" />
      <path d="M 320 138 Q 326 144 332 142" />
    </g>
  </g>
</svg>
